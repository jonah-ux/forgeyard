[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeyard"
version = "0.1.0"
description = "Reviewable, reproducible execution records for coding-agent work"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
forgeyard = "forgeyard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
