name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: test workbench receipt behavior
        run: node --test tests/workbench-runtime.test.cjs
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - name: benchmark public compose path
        run: python scripts/benchmark_compose.py --iterations 3 --json
      - name: run reproducible evaluation receipt
        run: python scripts/evaluate_lab.py --iterations 3 --warmup 1 --json
      - name: audit public supply-chain surface
        run: python scripts/audit_public_surface.py --json
