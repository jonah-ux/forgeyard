name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated tag to publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh annotated release tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit("release tag must be vMAJOR.MINOR.PATCH")
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match project version {version}")
          if subprocess.check_output(["git", "cat-file", "-t", f"refs/tags/{tag}"], text=True).strip() != "tag":
              raise SystemExit("release tag must be annotated")
          tag_commit = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tag_commit != head:
              raise SystemExit("release tag does not identify checked-out HEAD")
          print(f"Release identity verified: {tag} -> {head}")
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build pytest
          python -m pip install -e .
          python -m pytest -q
          python -m build --sdist --wheel
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          mkdir release-evidence
          python scripts/evaluate_lab.py --iterations 3 --warmup 1 --dist-dir ./dist --install --json > release-evidence/evaluation.json
      - name: Verify wheel consumer
        run: |
          python -m venv "${RUNNER_TEMP}/forgeyard-wheel-consumer"
          "${RUNNER_TEMP}/forgeyard-wheel-consumer/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          env -u PYTHONPATH ./forgeyard-wheel-consumer/bin/python -I -c 'from pathlib import Path; import sys, forgeyard; assert Path(forgeyard.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          env -u PYTHONPATH ./forgeyard-wheel-consumer/bin/forgeyard --version
          env -u PYTHONPATH ./forgeyard-wheel-consumer/bin/forgeyard evaluate-refusals > "${GITHUB_WORKSPACE}/release-evidence/wheel-runtime.json"
      - name: Verify source consumer
        run: |
          python -m venv "${RUNNER_TEMP}/forgeyard-source-consumer"
          "${RUNNER_TEMP}/forgeyard-source-consumer/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          env -u PYTHONPATH ./forgeyard-source-consumer/bin/python -I -c 'from pathlib import Path; import sys, forgeyard; assert Path(forgeyard.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          env -u PYTHONPATH ./forgeyard-source-consumer/bin/forgeyard --version
          env -u PYTHONPATH ./forgeyard-source-consumer/bin/forgeyard evaluate-refusals > "${GITHUB_WORKSPACE}/release-evidence/sdist-runtime.json"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload distributions for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag || github.ref_name }}" dist/* release-evidence/*.json \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ github.repository }} ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease

  pypi:
    # Off until PyPI trusted publishing is configured for this repository.
    # Enable by setting the repository variable PYPI_PUBLISH to "true".
    if: vars.PYPI_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
